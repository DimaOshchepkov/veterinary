services:
  php:
    build:
      target: dev
    volumes:
      - .:/var/www/project
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: "mysql://app:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/app?serverVersion=8.4.0&charset=utf8mb4"
    extra_hosts:
      - "host.docker.internal:host-gateway"


  database:
    ports:
      - "3306:3306"
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/project:cached
      - ./infra/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_network

