services:
  php:
    build:
      context: .
      target: dev
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        TIMEZONE: Europe/Moscow
    volumes:
      - .:/var/www/project:cached
    environment:
      DATABASE_URL: "mysql://app:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/app?serverVersion=8.4.0&charset=utf8mb4"

    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/project:cached
      - ./infra/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  database_data:

