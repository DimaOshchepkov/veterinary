location ~* \.(?:css|js|jpe?g|png|gif|ico|woff2?|ttf|svg|webp|map)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    add_header X-Served-By "nginx-static" always;
    access_log off;
    log_not_found off;
    try_files $uri /index.php$is_args$args;
}

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME /var/www/project/public/index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/project/public;
    fastcgi_param HTTPS on;

    internal;
}


location ~ \.php$ {
    return 404;
}

error_log /var/log/nginx/project_error.log;
access_log /var/log/nginx/project_access.log;
